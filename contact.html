<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Red Flag Calculator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Fixed Top Glassmorphic Navigation Bar -->
  <header class="top-navbar">
    <a href="index.html" class="nav-brand">
      <span class="brand-flag">🚩</span> Red Flag Calculator
    </a>
    <nav class="nav-links">
      <a href="index.html" class="nav-item">Home</a>
      <a href="about.html" class="nav-item">About</a>
      <a href="https://aadi-iii.github.io/Love-Calculator/" target="_blank" rel="noopener noreferrer" class="nav-item external-link">
        Love Calculator 💖
      </a>
      <a href="contact.html" class="nav-item active">Contact</a>
    </nav>
  </header>
  <!-- Fixed Universal Back-to-Home Button -->
  <button onclick="location.href='index.html'" class="back-home-btn" aria-label="Back to Home">
    ← Back to Home
  </button>

  <div class="app-container">
    
    <!-- Top External Bold Header -->
    <div class="external-header">
      <h1 class="main-title">EVERY HEART DESERVES A BACKGROUND CHECK</h1>
      <span class="byline">by aadiii</span>
    </div>

    <!-- Contact Page Card -->
    <div class="glass-card page-card content-card fade-in">
      <div class="pill-badge red-badge">GET IN TOUCH</div>
      <h2 class="form-title" style="margin-bottom: 0.5rem;">Connect with Aditya Sharma</h2>
      <p class="form-subtitle" style="margin-bottom: 1.75rem;">Have questions, feedback, or toxic relationship stories? Reach out below!</p>

      <div class="social-links-grid">
        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="social-btn instagram">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
          Instagram
        </a>

        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="social-btn github">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
          </svg>
          GitHub
        </a>

        <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="social-btn linkedin">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
            <rect x="2" y="9" width="4" height="12"></rect>
            <circle cx="4" cy="4" r="2"></circle>
          </svg>
          LinkedIn
        </a>
      </div>

      <div class="button-group" style="margin-top: 2rem;">
        <button type="button" class="btn-primary" onclick="location.href='index.html'">
          Back to Home 🏠
        </button>
      </div>
    </div>

    <!-- Navigation Footer -->
    <nav class="footer-nav">
      <a href="about.html" class="nav-link">About</a>
      <span class="nav-dot">•</span>
      <a href="contact.html" class="nav-link active">Contact</a>
    </nav>

  </div>

  <!-- Background Animated SVG Elements -->
  <div id="background-elements" aria-hidden="true">
    <svg class="floating-svg pos-1 speed-1" viewBox="0 0 24 24" fill="none" stroke="#ff3333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
      <line x1="4" y1="22" x2="4" y2="15"/>

    <svg class="floating-svg pos-2 speed-3" viewBox="0 0 24 24" fill="none" stroke="#ff3333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>

</html>
