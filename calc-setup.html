<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toxicity Calculator - Duo Setup</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Fixed Top Glassmorphic Navigation Bar -->
  <header class="top-navbar">
    <a href="index.html" class="nav-brand">
      <span class="brand-flag">🚩</span> Red Flag Calculator
    </a>
    <nav class="nav-links">
      <a href="index.html" class="nav-item">Home</a>
      <a href="about.html" class="nav-item">About</a>
      <a href="https://aadi-iii.github.io/Love-Calculator/" target="_blank" rel="noopener noreferrer" class="nav-item external-link">
        Love Calculator 💖
      </a>
      <a href="contact.html" class="nav-item">Contact</a>
    </nav>
  </header>
  <!-- Fixed Universal Back-to-Home Button -->
  <button onclick="location.href='index.html'" class="back-home-btn" aria-label="Back to Home">
    ← Back to Home
  </button>

  <div class="app-container">
    
    <!-- Top External Bold Header -->
    <div class="external-header">
      <h1 class="main-title">EVERY HEART DESERVES A BACKGROUND CHECK</h1>
      <span class="byline">by aadiii</span>
    </div>

    <!-- Split Setup Card (#calc-setup-card) -->
    <div id="calc-setup-card" class="main-card page-card fade-in">
      
      <!-- Left Pane: Badge & Info -->
      <div class="card-left">
        <div class="pill-badge red-badge">INSTANT REGRET GENERATOR</div>
        <h2 class="left-title">Toxicity Calculator</h2>
        <p class="left-subtitle">Enter both names to calculate your relationship's exact toxicity match score.</p>
      </div>

      <!-- Right Pane: Active Form -->
      <div class="card-right active-pane">
        <div class="form-header">
          <h2 class="form-title">Calculate Match</h2>
          <p class="form-subtitle">Enter names to begin</p>
        </div>

        <form id="calc-setup-form" onsubmit="return false;">
          <div class="input-group">
            <label for="player-name">Your Name</label>
            <input 
              type="text" 
              id="player-name" 
              placeholder="e.g. Alex" 
              autocomplete="off" 
              required
            >
          </div>

          <div class="input-group">
            <label for="partner-name">Partner / Crush Name</label>
            <input 
              type="text" 
              id="partner-name" 
              placeholder="e.g. Jordan" 
              autocomplete="off" 
              required
            >
          </div>

          <div class="button-group">
            <button type="submit" id="start-calc-btn" class="btn-primary btn-alt">
              Calculate Match ☣️
            </button>
            <button type="button" class="btn-secondary" onclick="location.href='index.html'">
              ← Back to Menu
            </button>
          </div>
        </form>
      </div>

    </div>

    <!-- Navigation Footer -->
    <nav class="footer-nav">
      <a href="about.html" class="nav-link">About</a>
      <span class="nav-dot">•</span>
      <a href="contact.html" class="nav-link">Contact</a>
    </nav>

  </div>

  <!-- Background Animated SVG Elements -->
  <div id="background-elements" aria-hidden="true">
    <svg class="floating-svg pos-1 speed-1" viewBox="0 0 24 24" fill="none" stroke="#ff3333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
      <line x1="4" y1="22" x2="4" y2="15"/>
    </svg>
    <svg class="floating-svg pos-2 speed-3" viewBox="0 0 24 24" fill="none" stroke="#ff3333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      <path d="M12 5.67l-1.5 4.5 3 2.5-2.5 3.5"/>
    </svg>
  </div>

  <script src="calc-setup.js"></script>
</body>
</html>
