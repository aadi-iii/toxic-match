<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toxicity Match Calculator - Playing</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Fixed Top Glassmorphic Navigation Bar -->
  <header class="top-navbar">
    <a href="index.html" class="nav-brand">
      <span class="brand-flag">🚩</span> Red Flag Calculator
    </a>
    <nav class="nav-links">
      <a href="index.html" class="nav-item">Home</a>
      <a href="about.html" class="nav-item">About</a>
      <a href="https://aadi-iii.github.io/Love-Calculator/" target="_blank" rel="noopener noreferrer" class="nav-item external-link">
        Love Calculator 💖
      </a>
      <a href="contact.html" class="nav-item">Contact</a>
    </nav>
  </header>
  <!-- Fixed Universal Back Button (Returns to Setup Page) -->
  <button onclick="location.href='calc-setup.html'" class="back-home-btn" aria-label="Back to Setup">
    ← Back to Setup
  </button>

  <div class="app-container">
    
    <!-- Top External Bold Header -->
    <div class="external-header">
      <h1 class="main-title">EVERY HEART DESERVES A BACKGROUND CHECK</h1>
      <span class="byline">by aadiii</span>
    </div>

    <!-- Duo Interactive Quiz Screen Container (Active by default) -->
    <div id="calc-quiz-screen" class="quiz-screen glass-card page-card fade-in">
      <div class="quiz-header">
        <span id="calc-question-counter" class="question-counter">Question 1 of 10</span>
        <div class="progress-bar">
          <div id="calc-progress-fill" class="progress-fill" style="width: 10%;"></div>
        </div>
      </div>

      <h3 id="calc-question-text" class="question-text">Loading duo question...</h3>

      <div id="calc-options-container" class="options-container">
        <!-- Dynamic duo option buttons injected in calculator.js -->
      </div>
    </div>

    <!-- Result Screen Container (Hidden by default) -->
    <div id="calc-result-screen" class="result-screen glass-card page-card hidden" style="display: none;">
      <div class="result-header">
        <span class="pill-badge red-badge">Calculated Toxicity Match</span>
        <h2 id="calc-result-score" class="result-score">88%</h2>
        <div id="calc-result-badge-text" class="result-badge-text">Critical Nuclear Toxicity</div>
      </div>

      <div class="roast-container">
        <p id="calc-result-roast" class="result-roast">Your customized dual-name verdict will appear here!</p>
      </div>

      <div class="button-group">
        <button type="button" id="recalc-btn" class="btn-primary">
          Recalculate 🔄
        </button>
        <button type="button" class="btn-secondary" onclick="location.href='calc-setup.html'">
          Change Names 👥
        </button>
        <button type="button" class="btn-secondary" onclick="location.href='index.html'">
          Back to Home 🏠
        </button>
      </div>
    </div>

    <!-- Navigation Footer -->
    <nav class="footer-nav">
      <a href="about.html" class="nav-link">About</a>
      <span class="nav-dot">•</span>
      <a href="contact.html" class="nav-link">Contact</a>
    </nav>

  </div>

  <!-- Background Animated SVG Elements -->
  <div id="background-elements" aria-hidden="true">
    <svg class="floating-svg pos-1 speed-1" viewBox="0 0 24 24" fill="none" stroke="#ff3333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
      <line x1="4" y1="22" x2="4" y2="15"/>
    </svg>
    <svg class="floating-svg pos-2 speed-3" viewBox="0 0 24 24" fill="none" stroke="#ff3333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      <path d="M12 5.67l-1.5 4.5 3 2.5-2.5 3.5"/>
    </svg>
  </div>

  <script src="calc-questions.js"></script>
  <script src="calculator.js"></script>
</body>
</html>
